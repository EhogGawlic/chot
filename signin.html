<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <div id="bigbox">
        <h1>Sign in</h1><br>
        <form method="post" action="signin">
            <label for="usni">Username</label>
            <input name="username" id="usni"><br>
            <label for="pasi">Password</label>
            <input name="password" type="password" id="pasi"><br>
            <button type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
