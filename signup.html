<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <div id="bigbox">
        <h1>Sign up</h1><br>
        <form method="post" action="signup">
            <label for="usni">Username - make one</label>
            <input name="username" id="usni"><br>
            <label for="pasi">Password - make one</label>
            <input name="password" type="password" id="pasi"><br>
            <button type="submit">Sign up</button>
        </form>
    </div>
</body>
</html>
